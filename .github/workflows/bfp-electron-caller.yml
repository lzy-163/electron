name: Historical Electron test caller
on: pull_request
permissions:
  contents: read
  issues: read
  pull-requests: read
jobs:
  original:
    uses: ./.github/workflows/pipeline-segment-electron-test.yml
    with:
      target-platform: linux
      target-arch: x64
      test-runs-on: ubuntu-latest
      test-container: '{"image":"ubuntu:24.04"}'
